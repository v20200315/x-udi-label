server:
  port: 8083

spring:
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${DB_FILE_PATH:/opt/x-udi-label/data/x-udi-label-test.db}
    username:
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-sqlite.sql
  ai:
    model:
      chat: ${SAAS_AI_PROVIDER:ollama}
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:270m
    openai:
      base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        model: qwen-plus