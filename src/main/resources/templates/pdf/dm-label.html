<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Barcode Label</title>
    <style>
        @page {
            size: 380px 150px;
            margin: 0;
        }

        html,
        body {
            width: 380px;
            height: 150px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
            font-family: Arial, sans-serif;
            color: #000;
        }

        .tbl {
            width: 380px;
            height: 150px;
            border-collapse: collapse;
            border-spacing: 0;
            border: none;
            margin: 0;
            padding: 0;
        }

        .tbl td {
            border: none;
            margin: 0;
            padding: 0;
            vertical-align: middle;
        }

        /* 左侧:Data Matrix,150x150 原尺寸,不缩放 */
        .tbl td.col-code {
            width: 150px;
            height: 150px;
            line-height: 0;
            font-size: 0;
        }

        .tbl svg {
            display: block;
            width: 150px;
            height: 150px;
        }

        /* 右侧:GS1 文字 */
        .tbl td.col-text {
            width: 230px;
            height: 150px;
            padding-left: 10px;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            line-height: 20px;
            white-space: nowrap;
        }

        .tbl td.col-text p {
            margin: 0 0 6px 0;
            padding: 0;
        }

        .tbl td.col-text p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
<table class="tbl">
    <tr>
        <td class="col-code" th:utext="${barcodeSvg}"></td>
        <td class="col-text" th:utext="${displayText}"></td>
    </tr>
</table>
</body>
</html>
