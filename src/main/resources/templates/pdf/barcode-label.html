<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Barcode Label</title>
    <style>
        @page {
            size: 1000px 145px;
            margin: 0;
        }

        html,
        body {
            width: 1000px;
            height: 145px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        .tbl {
            width: 1000px;
            border-collapse: collapse;
            border-spacing: 0;
            border: none;
            margin: 0;
            padding: 0;
        }

        .tbl td {
            border: none;
            margin: 0;
            padding: 0;
            text-align: center;
            vertical-align: middle;
        }

        /* 顶部间距行 */
        .tbl tr.row-gap-top td {
            height: 15px;
            line-height: 0;
            font-size: 0;
        }

        /* SVG 行 */
        .tbl tr.row-code td {
            height: 100px;
            line-height: 0;
            font-size: 0;
        }

        .tbl svg {
            display: block;
            width: 1000px;
            height: 100px;
            margin: 0 auto;
        }

        /* 文字行(含下方间距) */
        .tbl tr.row-text td {
            height: 30px;
            font-size: 16px;
            line-height: 30px;
        }
    </style>
</head>
<body>
<table class="tbl">
    <tr class="row-gap-top">
        <td>&#160;</td>
    </tr>
    <tr class="row-code">
        <td th:utext="${barcodeSvg}"></td>
    </tr>
    <tr class="row-text">
        <td th:utext="${displayText}"></td>
    </tr>
</table>
</body>
</html>
