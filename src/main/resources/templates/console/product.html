<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{console/layout :: layout(~{::content}, ${pageTitle}, ${activePage})}">
<body>
<main th:fragment="content" class="page-body">
    <div class="container-xl">
        <div class="col-12">
            <div class="card">

                <!-- 页面标题 -->
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h2 class="card-title" th:text="${pageSubTitle}">产品列表</h2>

                    <a class="btn btn-primary d-none d-sm-inline-block"
                       th:href="@{/product/new}">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             aria-hidden="true"
                             focusable="false"
                             class="icon">
                            <path d="M12 5l0 14"/>
                            <path d="M5 12l14 0"/>
                        </svg>
                        添加产品
                    </a>
                </div>

                <!-- 产品列表 -->
                <div class="table-responsive">
                    <table class="table table-selectable card-table table-vcenter text-nowrap">
                        <thead>
                        <tr>
                            <th class="w-1 text-center">序号</th>
                            <th>GTIN / DI</th>
                            <th>批号</th>
                            <th>产品名称</th>
                            <th>产品规格</th>
                            <th>产品型号</th>
                            <th>生产日期</th>
                            <th>有效期至</th>
                            <th></th>
                        </tr>
                        </thead>

                        <tbody>
                        <!-- 产品数据 -->
                        <tr th:each="product, stat : ${products}">
                            <td class="text-center">
                                <span class="text-secondary"
                                      th:text="${stat.count}">1</span>
                            </td>

                            <td th:text="${product.indicatorDigit
                                + product.companyPrefix
                                + product.itemReference
                                + product.checkDigit}">
                            </td>

                            <td>
                                <div class="text-truncate"
                                     style="max-width: 10em;"
                                     th:title="${product.lotNumber}"
                                     th:text="${product.lotNumber != null
                                         ? product.lotNumber : '-'}">
                                </div>
                            </td>

                            <td>
                                <div class="text-truncate"
                                     style="max-width: 10em;"
                                     th:title="${product.name}"
                                     th:text="${product.name}">
                                </div>
                            </td>

                            <td>
                                <div class="text-truncate"
                                     style="max-width: 10em;"
                                     th:title="${product.specification}"
                                     th:text="${product.specification != null
                                         ? product.specification : '-'}">
                                </div>
                            </td>

                            <td>
                                <div class="text-truncate"
                                     style="max-width: 10em;"
                                     th:title="${product.model}"
                                     th:text="${product.model != null
                                         ? product.model : '-'}">
                                </div>
                            </td>

                            <td th:text="${product.productionDate != null
                                ? #temporals.format(product.productionDate, 'yyyy-MM-dd')
                                : '-'}">
                            </td>

                            <td th:text="${product.expirationDate != null
                                ? #temporals.format(product.expirationDate, 'yyyy-MM-dd')
                                : '-'}">
                            </td>

                            <!-- 操作菜单 -->
                            <td class="text-end">
                                <div class="dropdown">
                                    <button type="button"
                                            class="btn dropdown-toggle align-text-top"
                                            data-bs-toggle="dropdown"
                                            data-bs-popper-config='{"strategy":"fixed"}'>
                                        操作
                                    </button>
                                    <div class="dropdown-menu dropdown-menu-end">
                                        <a class="dropdown-item"
                                           th:href="@{/product/{id}/edit(id=${product.id})}">
                                            编辑产品
                                        </a>

                                        <a class="dropdown-item"
                                           th:href="@{/product/{id}/label/generate(id=${product.id})}">
                                            生成标签
                                        </a>
                                    </div>
                                </div>
                            </td>
                        </tr>

                        <!-- 空数据提示 -->
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="9"
                                class="text-center text-secondary py-4">
                                暂无产品数据
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 底部信息 -->
                <div class="card-footer">
                    <div class="d-flex justify-content-end">
                        <div class="text-secondary">
                            共
                            <strong th:text="${#lists.size(products)}">0</strong>
                            个产品
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>
</body>
</html>
