<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{console/layout :: layout(~{::content}, 'Dashboard', 'index')}">
<body>
<main th:fragment="content" class="page-body">
    <div class="container-xl">
        <div class="row row-deck row-cards">
            <div class="col-sm-6 col-lg-3">
                <div class="card"><div class="card-body">
                    <div class="subheader">Customers</div><div class="h1 mb-3">128</div><div>Active customers</div>
                </div></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card"><div class="card-body">
                    <div class="subheader">Orders</div><div class="h1 mb-3">356</div><div>Total orders</div>
                </div></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card"><div class="card-body">
                    <div class="subheader">Products</div><div class="h1 mb-3">42</div><div>Available products</div>
                </div></div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="card"><div class="card-body">
                    <div class="subheader">Revenue</div><div class="h1 mb-3">¥128,600</div><div>This month</div>
                </div></div>
            </div>
            <div class="col-12">
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Welcome to X-UDI-LABEL Console</h3></div>
                    <div class="card-body">
                        <p>This is the X-UDI-LABEL management console.</p>
                        <p class="text-secondary mb-0">Spring Boot + Thymeleaf + Tabler</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
