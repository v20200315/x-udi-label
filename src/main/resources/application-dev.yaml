server:
  port: 8083

spring:
  config:
    import: optional:nacos:x-udi-label-dev.yml
  cloud:
    nacos:
      server-addr: localhost:8848
      config:
        namespace: fc4a65ae-c645-4b25-a220-02b2c1ec8a49
        file-extension: yml
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: x-udi-label
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/my-company